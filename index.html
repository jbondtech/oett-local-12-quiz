/**
 * Module 1: Stacked Material Thickness Generator (OETT Local 12)
 * Calculates total 3-layer material thickness sandwiches with mixed trade stock fractions.
 */
class StackedMaterialThicknessGenerator {
  constructor() {
    this.pools = ['TIER_1_LIKE_DENOMINATORS', 'TIER_2_TRADE_STANDARD_DENOMINATORS', 'TIER_3_COMPLEX_MIXED_DENOMINATORS'];
    this.scenarios = ['wear pad shim stack', 'concrete formwork assembly', 'trench plate support stack', 'crane outrigger dunnage'];
  }

  gcd(a, b) { return b === 0 ? a : this.gcd(b, a % b); }

  reduceFraction(num, den) {
    if (num === 0) return { whole: 0, num: 0, den: 1, str: "0" };
    const g = this.gcd(Math.abs(num), Math.abs(den));
    let n = num / g;
    let d = den / g;
    const w = Math.floor(n / d);
    n = n % d;
    let fracStr = "";
    if (w > 0 && n > 0) fracStr = `${w} ${n}/${d}`;
    else if (w > 0 && n === 0) fracStr = `${w}`;
    else if (w === 0 && n > 0) fracStr = `${n}/${d}`;
    else fracStr = "0";
    return { whole: w, num: n, den: d, str: fracStr };
  }

  generateSingleProblem(type) {
    let t1_w = 0, t1_n = 1, t1_d = 8;
    let t2_w = 0, t2_n = 1, t2_d = 8;
    let t3_w = 0, t3_n = 1, t3_d = 8;

    if (type === 'TIER_1_LIKE_DENOMINATORS') {
      t1_d = t2_d = t3_d = 8;
      t1_n = [1, 3, 5, 7][Math.floor(Math.random() * 4)];
      t2_n = [1, 3, 5, 7][Math.floor(Math.random() * 4)];
      t3_n = [1, 3, 5, 7][Math.floor(Math.random() * 4)];
    } else if (type === 'TIER_2_TRADE_STANDARD_DENOMINATORS') {
      t1_d = 4; t2_d = 8; t3_d = 16;
      t1_n = [1, 3][Math.floor(Math.random() * 2)];
      t2_n = [1, 3, 5, 7][Math.floor(Math.random() * 4)];
      t3_n = [1, 3, 5, 7, 9, 11, 13, 15][Math.floor(Math.random() * 8)];
    } else {
      t1_d = 2; t2_d = 8; t3_d = 16; t1_w = 1; t2_w = 2;
      t1_n = 1; t2_n = 3; t3_n = 5;
    }

    const commonDen = 16;
    const totalSixteenths = (t1_w * 16 + t1_n * (16 / t1_d)) +
                           (t2_w * 16 + t2_n * (16 / t2_d)) +
                           (t3_w * 16 + t3_n * (16 / t3_d));

    const ans = this.reduceFraction(totalSixteenths, 16);
    const scenario = this.scenarios[Math.floor(Math.random() * this.scenarios.length)];

    const f1Str = t1_w > 0 ? `${t1_w} ${t1_n}/${t1_d}` : `${t1_n}/${t1_d}`;
    const f2Str = t2_w > 0 ? `${t2_w} ${t2_n}/${t2_d}` : `${t2_n}/${t2_d}`;
    const f3Str = t3_w > 0 ? `${t3_w} ${t3_n}/${t3_d}` : `${t3_n}/${t3_d}`;

    const promptText = `An Operating Engineer field mechanic is building a 3-layer ${scenario}. Layer 1 measures ${f1Str} inches, Layer 2 measures ${f2Str} inches, and Layer 3 measures ${f3Str} inches. What is the total combined thickness in inches?`;

    const optSet = new Set([ans.str]);
    optSet.add(this.reduceFraction(totalSixteenths + 2, 16).str);
    optSet.add(this.reduceFraction(totalSixteenths - 2, 16).str);
    optSet.add(this.reduceFraction(totalSixteenths + 4, 16).str);

    const options = Array.from(optSet).sort(() => Math.random() - 0.5);

    return {
      id: `oett12_stack_${Date.now()}_${Math.floor(Math.random() * 900 + 100)}`,
      type: "STACKED_MATERIAL_THICKNESS",
      internalType: type,
      prompt: promptText,
      correctAnswer: ans.str,
      options: options,
      explanation: `Convert all layers to 16ths: ${f1Str} + ${f2Str} + ${f3Str} = ${ans.str} inches.`,
      points: 1
    };
  }

  generateBatch(mode = 'MIXED', count = 5) {
    const list = [];
    for (let i = 0; i < count; i++) {
      let t = mode === 'MIXED' ? this.pools[i % this.pools.length] : mode;
      list.push(this.generateSingleProblem(t));
    }
    return list.sort(() => Math.random() - 0.5);
  }
}

/**
 * Module 2: Bulk Hardware Weight Generator (OETT Local 12)
 * Multiplies hardware piece counts by unit weights (decimals and whole numbers).
 */
class BulkHardwareWeightGenerator {
  constructor() {
    this.pools = ['TIER_1_INTEGER_UNIT_WEIGHTS', 'TIER_2_HALVES_QUARTERS_DECIMALS', 'TIER_3_PRECISION_DECIMAL_WEIGHTS'];
    this.hardware = ['grade-8 anchor bolts', 'excavator bucket tooth pins', 'hydraulic hose fittings', 'crane track shoe pins'];
  }

  generateSingleProblem(type) {
    const item = this.hardware[Math.floor(Math.random() * this.hardware.length)];
    let count = Math.floor(Math.random() * 30 + 10);
    let unitWeight = 2.5;

    if (type === 'TIER_1_INTEGER_UNIT_WEIGHTS') {
      unitWeight = Math.floor(Math.random() * 8 + 2);
    } else if (type === 'TIER_2_HALVES_QUARTERS_DECIMALS') {
      unitWeight = [1.5, 2.25, 3.5, 4.75, 6.5][Math.floor(Math.random() * 5)];
    } else {
      unitWeight = parseFloat((Math.random() * 5 + 1.15).toFixed(2));
    }

    const totalWeight = parseFloat((count * unitWeight).toFixed(2));
    const correctAnswerStr = `${totalWeight} lbs`;

    const promptText = `A jobsite shipment contains ${count} heavy-duty ${item}. If each unit weighs ${unitWeight} lbs, what is the total weight of the shipment?`;

    const dAdd = `${(count + unitWeight).toFixed(2)} lbs`;
    const dOff = `${(totalWeight + unitWeight).toFixed(2)} lbs`;
    const dSub = `${(totalWeight - 2.5).toFixed(2)} lbs`;

    const options = Array.from(new Set([correctAnswerStr, dAdd, dOff, dSub])).sort(() => Math.random() - 0.5);

    return {
      id: `oett12_hw_${Date.now()}_${Math.floor(Math.random() * 900 + 100)}`,
      type: "BULK_HARDWARE_WEIGHT",
      internalType: type,
      prompt: promptText,
      correctAnswer: correctAnswerStr,
      options: options,
      explanation: `Total Weight = Count × Unit Weight = ${count} × ${unitWeight} lbs = ${correctAnswerStr}.`,
      points: 1
    };
  }

  generateBatch(mode = 'MIXED', count = 5) {
    const list = [];
    for (let i = 0; i < count; i++) {
      let t = mode === 'MIXED' ? this.pools[i % this.pools.length] : mode;
      list.push(this.generateSingleProblem(t));
    }
    return list.sort(() => Math.random() - 0.5);
  }
}

/**
 * Module 3: Operating Engineers Unit Conversion Generator (OETT Local 12)
 * Linear conversions between inches, feet, yards, miles, and surveyor decimal feet.
 */
class OperatingEngineersUnitConversionGenerator {
  constructor() {
    this.pools = ['TIER_1_INCHES_TO_FEET_YARDS', 'TIER_2_FEET_TO_MILES', 'TIER_3_SURVEYOR_DECIMAL_FEET_RODS'];
  }

  generateSingleProblem(type) {
    let promptText = '', correctAnswerStr = '', explanationStr = '';
    let options = [];

    if (type === 'TIER_1_INCHES_TO_FEET_YARDS') {
      const feet = Math.floor(Math.random() * 15 + 3);
      const inches = feet * 12;
      correctAnswerStr = `${feet} ft`;
      promptText = `Convert a trench depth measurement of ${inches} inches into feet.`;
      explanationStr = `${inches} inches ÷ 12 inches/ft = ${correctAnswerStr}.`;
      options = [correctAnswerStr, `${feet + 2} ft`, `${feet - 1} ft`, `${inches * 12} ft`].sort(() => Math.random() - 0.5);

    } else if (type === 'TIER_2_FEET_TO_MILES') {
      const miles = [0.5, 1.5, 2.5, 3.0][Math.floor(Math.random() * 4)];
      const feet = miles * 5280;
      correctAnswerStr = `${miles} miles`;
      promptText = `A highway excavation project extends over a length of ${feet.toLocaleString()} feet. How many miles does this equal?`;
      explanationStr = `${feet.toLocaleString()} ft ÷ 5,280 ft/mile = ${correctAnswerStr}.`;
      options = [correctAnswerStr, `${miles + 1} miles`, `${miles - 0.25} miles`, `${(feet/1000).toFixed(1)} miles`].sort(() => Math.random() - 0.5);

    } else {
      const wholeFeet = Math.floor(Math.random() * 10 + 5);
      const inchVal = 6; // 0.5 ft
      const decimalFeet = wholeFeet + 0.5;
      correctAnswerStr = `${decimalFeet.toFixed(2)} ft`;
      promptText = `A grade checker rod reading shows ${wholeFeet} feet ${inchVal} inches. Convert this reading into surveyor decimal feet.`;
      explanationStr = `${inchVal} inches ÷ 12 = 0.50 ft. Total = ${wholeFeet} + 0.50 = ${correctAnswerStr}.`;
      options = [correctAnswerStr, `${wholeFeet}.${inchVal} ft`, `${wholeFeet + 1}.00 ft`, `${decimalFeet + 0.25} ft`].sort(() => Math.random() - 0.5);
    }

    return {
      id: `oett12_unit_${Date.now()}_${Math.floor(Math.random() * 900 + 100)}`,
      type: "OPERATING_ENGINEERS_UNIT_CONVERSION",
      internalType: type,
      prompt: promptText,
      correctAnswer: correctAnswerStr,
      options: options,
      explanation: explanationStr,
      points: 1
    };
  }

  generateBatch(mode = 'MIXED', count = 5) {
    const list = [];
    for (let i = 0; i < count; i++) {
      let t = mode === 'MIXED' ? this.pools[i % this.pools.length] : mode;
      list.push(this.generateSingleProblem(t));
    }
    return list.sort(() => Math.random() - 0.5);
  }
}

/**
 * Module 4: Rate-Based Material Cost Generator (OETT Local 12)
 * Calculates material costs across linear, weight, fluid, and pipe joint pricing.
 */
class RateBasedMaterialCostGenerator {
  constructor() {
    this.pools = ['TIER_1_LINEAR_MATERIAL_COST', 'TIER_2_WEIGHT_TONNAGE_COST', 'TIER_3_FLUID_VOLUME_COST', 'TIER_4_PIPE_JOINT_SECTION_COST'];
  }

  generateSingleProblem(type) {
    let promptText = '', correctAnswerStr = '', explanationStr = '';
    let options = [];

    if (type === 'TIER_1_LINEAR_MATERIAL_COST') {
      const feet = Math.floor(Math.random() * 200 + 50);
      const rate = 3.50;
      const total = feet * rate;
      correctAnswerStr = `\$${total.toFixed(2)}`;
      promptText = `An equipment supervisor orders ${feet} feet of heavy-duty crane hoist wire rope at \$${rate.toFixed(2)} per linear foot. What is the total cost?`;
      explanationStr = `${feet} ft × \$${rate.toFixed(2)}/ft = ${correctAnswerStr}.`;
      options = [correctAnswerStr, `\$${(total + 50).toFixed(2)}`, `\$${(feet + rate).toFixed(2)}`, `\$${(total - 35).toFixed(2)}`].sort(() => Math.random() - 0.5);

    } else if (type === 'TIER_2_WEIGHT_TONNAGE_COST') {
      const tons = Math.floor(Math.random() * 40 + 10);
      const rate = 22.50;
      const total = tons * rate;
      correctAnswerStr = `\$${total.toFixed(2)}`;
      promptText = `A civil paving job requires ${tons} tons of aggregate base rock delivered at \$${rate.toFixed(2)} per ton. Calculate the total material cost.`;
      explanationStr = `${tons} tons × \$${rate.toFixed(2)}/ton = ${correctAnswerStr}.`;
      options = [correctAnswerStr, `\$${(total + 100).toFixed(2)}`, `\$${(total - 45).toFixed(2)}`, `\$${(tons * 10).toFixed(2)}`].sort(() => Math.random() - 0.5);

    } else if (type === 'TIER_3_FLUID_VOLUME_COST') {
      const drums = Math.floor(Math.random() * 5 + 2);
      const drumGal = 55;
      const galRate = 12.00;
      const total = drums * drumGal * galRate;
      correctAnswerStr = `\$${total.toFixed(2)}`;
      promptText = `A maintenance shop purchases ${drums} 55-gallon drums of ISO 46 hydraulic oil at \$${galRate.toFixed(2)} per gallon. What is the total invoice cost?`;
      explanationStr = `${drums} drums × 55 gal/drum = ${drums * 55} gal. ${drums * 55} gal × \$${galRate.toFixed(2)}/gal = ${correctAnswerStr}.`;
      options = [correctAnswerStr, `\$${(drums * galRate).toFixed(2)}`, `\$${(total + 200).toFixed(2)}`, `\$${(total - 110).toFixed(2)}`].sort(() => Math.random() - 0.5);

    } else {
      const joints = Math.floor(Math.random() * 15 + 5);
      const lengthPerJoint = 20; // ft
      const ratePerFt = 18.50;
      const total = joints * lengthPerJoint * ratePerFt;
      correctAnswerStr = `\$${total.toFixed(2)}`;
      promptText = `A utility drainage job orders ${joints} joints of 24-inch corrugated pipe (20 feet per joint) at \$${ratePerFt.toFixed(2)} per linear foot. Calculate the total cost.`;
      explanationStr = `${joints} joints × 20 ft = ${joints * 20} ft. ${joints * 20} ft × \$${ratePerFt.toFixed(2)}/ft = ${correctAnswerStr}.`;
      options = [correctAnswerStr, `\$${(joints * ratePerFt).toFixed(2)}`, `\$${(total + 300).toFixed(2)}`, `\$${(total - 150).toFixed(2)}`].sort(() => Math.random() - 0.5);
    }

    return {
      id: `oett12_cost_${Date.now()}_${Math.floor(Math.random() * 900 + 100)}`,
      type: "RATE_BASED_MATERIAL_COST",
      internalType: type,
      prompt: promptText,
      correctAnswer: correctAnswerStr,
      options: options,
      explanation: explanationStr,
      points: 1
    };
  }

  generateBatch(mode = 'MIXED', count = 5) {
    const list = [];
    for (let i = 0; i < count; i++) {
      let t = mode === 'MIXED' ? this.pools[i % this.pools.length] : mode;
      list.push(this.generateSingleProblem(t));
    }
    return list.sort(() => Math.random() - 0.5);
  }
}

/**
 * Module 11: Multi-Term Fraction Summation Generator (OETT Local 12)
 * Multi-term fraction and mixed-number additions across LCDs of 16, 24, 30.
 */
class MultiTermFractionSummationGenerator {
  constructor() {
    this.pools = ['TIER_1_FOUR_TERM_INCH_FRACTIONS', 'TIER_2_FIVE_TERM_LCD24_30_SUMS', 'TIER_3_MIXED_NUMBER_BOOM_CLEARANCE'];
  }

  gcd(a, b) { return b === 0 ? a : this.gcd(b, a % b); }

  reduceFraction(num, den) {
    const g = this.gcd(Math.abs(num), Math.abs(den));
    let n = num / g, d = den / g;
    const w = Math.floor(n / d);
    n = n % d;
    if (w > 0 && n > 0) return `${w} ${n}/${d}`;
    if (w > 0 && n === 0) return `${w}`;
    return `${n}/${d}`;

  constructor() {
    this.pools = [
      'TIER_1_YEARLY_SCALE_MULTIPLIER',

    const svgWidth = 480, svgHeight = 240;
    const paddingLeft = 60, paddingBottom = 40, paddingTop = 35, paddingRight = 20;
    const plotWidth = svgWidth - paddingLeft - paddingRight;
    const plotHeight = svgHeight - paddingTop - paddingBottom;

    const maxVal = Math.max(...values, 1) * 1.15;
    const numBars = labels.length;
    const gap = 12;
    const barWidth = Math.max(12, (plotWidth - (numBars + 1) * gap) / numBars);

    let barsHtml = '';
    let gridHtml = '';

    const numGridLines = 4;
    for (let i = 0; i <= numGridLines; i++) {
      const gridVal = (maxVal * (i / numGridLines));
      const yPos = svgHeight - paddingBottom - (plotHeight * (i / numGridLines));
      gridHtml += `<line x1="${paddingLeft}" y1="${yPos}" x2="${svgWidth - paddingRight}" y2="${yPos}" stroke="#e2e8f0" stroke-dasharray="3,3" />`;

      const val = values[idx];
      const barH = (val / maxVal) * plotHeight;

      barsHtml += `<rect x="${xPos}" y="${yPos}" width="${barWidth}" height="${barH}" fill="${barColor}" rx="3" ry="3" />`;

      options = ["2,050,000 tonnes", "205 tonnes", "1,250,000 tonnes", "3,040,000 tonnes"].sort(() => Math.random() - 0.5);

    } else if (type === 'TIER_2_MULTI_SERIES_CATEGORY_GROUP') {
      const groups = ['Group 1', 'Group 2', 'Group 3', 'Group 4', 'Group 5'];
      const menScores = [20, 34, 30, 35, 27];
      const womenScores = [25, 32, 34, 20, 25];
      diagramSvg = this.generateGroupedSeriesSVG(groups, menScores, womenScores, "Men", "Women", "Scores Across Category Groups");

      correctAnswerStr = "136";
      promptText = "What was the total combined score of Women across all 5 groups? (See chart below)";
      explanationStr = "Women scores: 25 + 32 + 34 + 20 + 25 = 136.";
      options = ["136", "146", "27.2", "150"].sort(() => Math.random() - 0.5);

    } else if (type === 'TIER_3_MONTHLY_TIME_SUBSETS') {
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
      const values = [200, 400, 150, 450, 500, 220];
      diagramSvg = this.generateSingleSeriesSVG(months, values, "Monthly Production (*Units in Thousands)", "#059669");

      correctAnswerStr = "750,000 units";
      promptText = "How many units were produced in the first 3 months shown in the chart combined?";
      explanationStr = "Jan + Feb + Mar = 200 + 400 + 150 = 750 (thousand) = 750,000 units.";
      options = ["750,000 units", "750 units", "1,920,000 units", "500,000 units"].sort(() => Math.random() - 0.5);

    } else if (type === 'TIER_4_FLEET_FUEL_AND_HOURS') {
      const machines = ['Excavator', 'Dozer', 'Loader', 'Grader', 'Scraper'];
      const fuelRates = [12.5, 18.0, 14.2, 10.5, 22.0];
      const operatingHours = [40, 48, 35, 52, 44];
      diagramSvg = this.generateGroupedSeriesSVG(machines, fuelRates, operatingHours, "Fuel Rate (gal/hr)", "Weekly Hours", "Fleet Operations Metrics");

      correctAnswerStr = "15.44 gal/hr";
      promptText = "Using the fleet operations chart below, what is the average hourly fuel consumption rate across all 5 heavy equipment types?";
      explanationStr = "Total Fuel Rates = 12.5 + 18.0 + 14.2 + 10.5 + 22.0 = 77.2 gal/hr. Average = 77.2 ÷ 5 = 15.44 gal/hr.";
      options = ["15.44 gal/hr", "17.20 gal/hr", "22.00 gal/hr", "12.50 gal/hr"].sort(() => Math.random() - 0.5);

    } else if (type === 'TIER_5_EARTHWORK_YARDAGE_MOVEMENT') {
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
      const yardage = [1250, 1800, 2100, 1950, 2400, 1600];
      diagramSvg = this.generateSingleSeriesSVG(months, yardage, "Earthwork Volume Moved (cu yds)", "#d97706");

      correctAnswerStr = "5,150 cu yds";
      promptText = "What was the total volume of earthwork material moved during the first quarter (January, February, March)?";
      explanationStr = "Q1 Total = 1,250 + 1,800 + 2,100 = 5,150 cu yds.";
      options = ["5,150 cu yds", "11,400 cu yds", "16,550 cu yds", "4,200 cu yds"].sort(() => Math.random() - 0.5);

    } else {
      const models = ['320 CAT', '336 CAT', 'D6 Dozer', 'D8 Dozer', '966 Loader'];
      const scheduledMaint = [12, 16, 20, 24, 10];
      const unscheduledRepairs = [8, 14, 22, 19, 5];
      diagramSvg = this.generateGroupedSeriesSVG(models, scheduledMaint, unscheduledRepairs, "Scheduled Maint (hrs)", "Unscheduled Repairs (hrs)", "Fleet Maintenance Hours");

      correctAnswerStr = "68 hours";
      promptText = "What was the total number of unscheduled repair hours incurred across all 5 machinery models?";
      explanationStr = "Unscheduled repairs = 8 + 14 + 22 + 19 + 5 = 68 hours.";
      options = ["68 hours", "90 hours", "158 hours", "45 hours"].sort(() => Math.random() - 0.5);
    }

    return {
      id: `oett12_chart_${Date.now()}_${Math.floor(Math.random() * 900 + 100)}`,
      type: "BAR_CHART_DATA_INTERPRETATION",
      internalType: type,
      prompt: promptText,
      diagramSvg: diagramSvg,
      correctAnswer: correctAnswerStr,
      options: options,
      explanation: explanationStr,
      points: 1
    };
  }

  generateBatch(mode = 'MIXED', count = 5) {
    const list = [];
    for (let i = 0; i < count; i++) {
      let t = mode === 'MIXED' ? this.pools[i % this.pools.length] : mode;
      list.push(this.generateSingleProblem(t));
    }
    return list.sort(() => Math.random() - 0.5);
  }
}



    // =========================================================
    // QUIZ ENGINE HARNESS & CONTROLLER
    // =========================================================
    class OETTQuizEngineController {
      constructor() {
        this.generators = {
          StackedMaterialThicknessGenerator: new StackedMaterialThicknessGenerator(),
          BulkHardwareWeightGenerator: new BulkHardwareWeightGenerator(),
          OperatingEngineersUnitConversionGenerator: new OperatingEngineersUnitConversionGenerator(),
          RateBasedMaterialCostGenerator: new RateBasedMaterialCostGenerator(),
          StackedMaterialQuantityGenerator: new StackedMaterialQuantityGenerator(),
          CompositeAssemblyCostingGenerator: new CompositeAssemblyCostingGenerator(),
          SafeWorkingLoadCapacityGenerator: new SafeWorkingLoadCapacityGenerator(),
          RectangularVolumeGenerator: new RectangularVolumeGenerator(),
          DecimalFractionEquivalenceGenerator: new DecimalFractionEquivalenceGenerator(),
          WeightedGroupAverageGenerator: new WeightedGroupAverageGenerator(),
          MultiTermFractionSummationGenerator: new MultiTermFractionSummationGenerator(),
          BulkGroupDozenConversionGenerator: new BulkGroupDozenConversionGenerator(),
          FractionalRateThreadPitchGenerator: new FractionalRateThreadPitchGenerator(),
          CompositeCutoutAreaGenerator: new CompositeCutoutAreaGenerator(),
          ToleranceRangeAcceptableValueGenerator: new ToleranceRangeAcceptableValueGenerator(),
          TabularDataLookupAverageGenerator: new TabularDataLookupAverageGenerator(),
          BarChartDataInterpretationGenerator: new BarChartDataInterpretationGenerator()
        };

        this.currentQuestions = [];
        this.initUI();
      }

      initUI() {
        const moduleSelect = document.getElementById('module-select');
        const countInput = document.getElementById('count-input');
        const countLimitLabel = document.getElementById('count-limit-label');
        const generateBtn = document.getElementById('generate-quiz-btn');
        const shareLinkBtn = document.getElementById('share-link-btn');
        const quizForm = document.getElementById('quiz-form');

        // Module selection change handler - auto-generates new batch
        moduleSelect.addEventListener('change', () => {
          if (moduleSelect.value === 'FULL_ASSESSMENT') {
            countInput.value = 22;
            countInput.disabled = true;
            countLimitLabel.textContent = '(Locked to 22 for Full Exam)';
          } else {
            countInput.disabled = false;
            countInput.value = Math.min(Math.max(parseInt(countInput.value) || 5, 1), 25);
            countLimitLabel.textContent = '(1 to 25 Questions)';
          }
          this.generateAndRenderQuiz();
        });

        // Question count change handler - auto-generates new batch
        countInput.addEventListener('change', () => {
          if (moduleSelect.value !== 'FULL_ASSESSMENT') {
            countInput.value = Math.min(Math.max(parseInt(countInput.value) || 5, 1), 25);
            this.generateAndRenderQuiz();
          }
        });

        // Generate Quiz Button Click
        generateBtn.addEventListener('click', (e) => {
          e.preventDefault();
          this.generateAndRenderQuiz();
        });

        // Copy Share Link Button Click
        shareLinkBtn.addEventListener('click', (e) => {
          e.preventDefault();
          this.copyStudentShareLink();
        });

        // Quiz Submission Handler
        quizForm.addEventListener('submit', (e) => {
          e.preventDefault();
          this.gradeAndSubmitQuiz();
        });

        // Parse URL parameters for Module, Count, ScriptUrl, and Student Mode
        const urlParams = new URLSearchParams(window.location.search);

        if (urlParams.has('module')) {
          const modParam = urlParams.get('module');
          if (moduleSelect.querySelector(`option[value="${modParam}"]`)) {
            moduleSelect.value = modParam;
          }
        }

        if (urlParams.has('count')) {
          const countParam = parseInt(urlParams.get('count'));
          if (countParam >= 1 && countParam <= 25) {
            countInput.value = countParam;
          }
        }

        if (urlParams.has('scriptUrl')) {
          document.getElementById('script-url-input').value = urlParams.get('scriptUrl');
        }

        if (urlParams.get('mode') === 'student' || window.location.hash.includes('quiz=')) {
          document.getElementById('teacher-control-card').style.display = 'none';
        }

        // Handle full assessment lock if needed
        if (moduleSelect.value === 'FULL_ASSESSMENT') {
          countInput.value = 22;
          countInput.disabled = true;
          countLimitLabel.textContent = '(Locked to 22 for Full Exam)';
        }

        // Initial Generation
        this.generateAndRenderQuiz();
      }

      generateAndRenderQuiz() {
        const moduleVal = document.getElementById('module-select').value;
        const countVal = parseInt(document.getElementById('count-input').value) || 5;

        if (moduleVal === 'FULL_ASSESSMENT') {
          this.currentQuestions = this.generateFullAssessment();
        } else {
          const gen = this.generators[moduleVal];
          if (gen) {
            this.currentQuestions = gen.generateBatch('MIXED', countVal);
          }
        }

        this.renderQuestions();
      }

      generateFullAssessment() {
        const questions = [];
        const moduleKeys = [
          'StackedMaterialThicknessGenerator',
          'BulkHardwareWeightGenerator',
          'OperatingEngineersUnitConversionGenerator',
          'RateBasedMaterialCostGenerator',
          'StackedMaterialQuantityGenerator',
          'CompositeAssemblyCostingGenerator',
          'SafeWorkingLoadCapacityGenerator',
          'RectangularVolumeGenerator',
          'DecimalFractionEquivalenceGenerator',
          'WeightedGroupAverageGenerator',
          'MultiTermFractionSummationGenerator',
          'BulkGroupDozenConversionGenerator',
          'FractionalRateThreadPitchGenerator',
          'CompositeCutoutAreaGenerator',
          'ToleranceRangeAcceptableValueGenerator',
          'TabularDataLookupAverageGenerator'
        ];

        // Questions 1 to 16: 1 from each of Modules 1 through 16
        moduleKeys.forEach(key => {
          const gen = this.generators[key];
          if (gen) {
            const batch = gen.generateBatch('MIXED', 1);
            questions.push(batch[0]);
          }
        });

        // Questions 17 to 22: Module 17 (Bar Chart Data) sampling 1 from each of its 6 tiers
        const chartGen = this.generators['BarChartDataInterpretationGenerator'];
        if (chartGen && chartGen.pools) {
          chartGen.pools.forEach(tierName => {
            const q = chartGen.generateSingleProblem(tierName);
            questions.push(q);
          });
        }

        return questions;
      }

      renderQuestions() {
        const container = document.getElementById('quiz-questions-container');
        const resultsBanner = document.getElementById('quiz-results-banner');
        resultsBanner.classList.add('hidden');
        resultsBanner.innerHTML = '';

        container.innerHTML = '';

        this.currentQuestions.forEach((q, idx) => {
          const qCard = document.createElement('div');
          qCard.className = 'oett-card p-6 space-y-4 border-l-4 border-blue-600';
          qCard.id = `q-card-${idx}`;

          let mediaHtml = '';
          if (q.diagramSvg) {
            mediaHtml = `<div class="my-3 text-center">${q.diagramSvg}</div>`;
          } else if (q.tableHtml) {
            mediaHtml = `<div class="my-3 overflow-x-auto">${q.tableHtml}</div>`;
          }

          let optionsHtml = q.options.map((opt, oIdx) => `
            <label class="oett-option-label flex items-center p-3 border border-slate-200 rounded-lg space-x-3 text-sm font-semibold text-slate-800" id="opt-label-${idx}-${oIdx}">
              <input type="radio" name="question-${idx}" value="${opt.replace(/"/g, '&quot;')}" class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500">
              <span class="flex-1">${opt}</span>
            </label>
          `).join('');

          qCard.innerHTML = `
            <div class="flex items-center justify-between text-xs font-bold text-slate-500 border-b pb-2">
              <span>QUESTION ${idx + 1} OF ${this.currentQuestions.length}</span>
              <span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded">${q.type.replace(/_/g, ' ')}</span>
            </div>
            <div class="text-base font-bold text-slate-900 leading-relaxed">
              ${q.prompt}
            </div>
            ${mediaHtml}
            <div class="space-y-2 pt-2">
              ${optionsHtml}
            </div>
            <div id="explanation-${idx}" class="hidden p-3 rounded-lg bg-slate-100 text-xs text-slate-700 border-l-4 border-slate-400 font-medium space-y-1">
              <div class="font-bold text-slate-900">Step-by-Step Explanation:</div>
              <div>${q.explanation}</div>
            </div>
          `;

          container.appendChild(qCard);
        });

        // Trigger MathJax Typesetting
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise();
        }
      }

      gradeAndSubmitQuiz() {
        let score = 0;
        const total = this.currentQuestions.length;

        const firstName = document.getElementById('student-first-name').value.trim();
        const lastName = document.getElementById('student-last-name').value.trim();


// ========================================================= 
// PART A: NAME VALIDATION GUARD (PASTE HERE) 
// ========================================================= 

if (!firstName || !lastName) { 
alert("⚠️ Please enter both your First and Last Name before submitting your assessment."); 

const nameCard = document.getElementById('student-info-card'); 
if (nameCard) nameCard.scrollIntoView({ behavior: 'smooth' }); 

if (!firstName) document.getElementById('student-first-name').classList.add('border-red-500'); 
if (!lastName) document.getElementById('student-last-name').classList.add('border-red-500'); 

return; // STOP! Do not grade or send to Google Sheets 
} 

// Reset red borders if names are valid 
document.getElementById('student-first-name').classList.remove('border-red-500'); 
document.getElementById('student-last-name').classList.remove('border-red-500'); 

// =========================================================


        this.currentQuestions.forEach((q, idx) => {
          const selected = document.querySelector(`input[name="question-${idx}"]:checked`);
          const expBox = document.getElementById(`explanation-${idx}`);
          if (expBox) expBox.classList.remove('hidden');

          q.options.forEach((opt, oIdx) => {
            const label = document.getElementById(`opt-label-${idx}-${oIdx}`);
            if (label) {
              label.classList.remove('correct-bg', 'incorrect-bg');
              if (opt === q.correctAnswer) {
                label.classList.add('correct-bg');
              }
            }
          });

          if (selected && selected.value === q.correctAnswer) {
            score++;
          } else if (selected) {
            const selectedOptIdx = q.options.indexOf(selected.value);
            if (selectedOptIdx !== -1) {
              const selectedLabel = document.getElementById(`opt-label-${idx}-${selectedOptIdx}`);
              if (selectedLabel) selectedLabel.classList.add('incorrect-bg');
            }
          }
        });

        const percentage = Math.round((score / total) * 100);
        const resultsBanner = document.getElementById('quiz-results-banner');
        resultsBanner.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-900', 'bg-rose-100', 'text-rose-900');

        if (percentage >= 70) {
          resultsBanner.classList.add('bg-emerald-100', 'text-emerald-900');
        } else {
          resultsBanner.classList.add('bg-rose-100', 'text-rose-900');
        }

        const studentNameDisplay = (firstName || lastName) ? `Student: ${firstName} ${lastName} — ` : '';

        // Send results to Google Sheets Script URL if provided
        const scriptUrl = document.getElementById('script-url-input').value.trim();
        let loggerText = '';
        if (scriptUrl) {
          loggerText = '<div class="text-xs font-semibold text-emerald-800 mt-1">✅ Score recorded in instructor Google Sheet.</div>';
          const payload = {
            firstName: firstName,
            lastName: lastName,
            score: score,
            total: total,
            percentage: percentage,
            module: document.getElementById('module-select').value,
            timestamp: new Date().toISOString()
          };

          fetch(scriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          }).catch(err => console.error("Error submitting to Google Sheets:", err));
        }

        resultsBanner.innerHTML = `
          <div>${studentNameDisplay}Score: ${score} / ${total} (${percentage}%)</div>
          <div class="text-xs font-normal mt-1">${percentage >= 70 ? '🎉 Passed OETT Assessment Benchmark' : '⚠️ Review Explanations & Retry Batch'}</div>
          ${loggerText}
        `;

        // Scroll to results banner
        resultsBanner.scrollIntoView({ behavior: 'smooth' });
      }

      copyStudentShareLink() {
        const currentUrl = new URL(window.location.href);
        const moduleVal = document.getElementById('module-select').value;
        const countVal = document.getElementById('count-input').value;
        const scriptUrl = document.getElementById('script-url-input').value.trim();

        currentUrl.searchParams.set('mode', 'student');
        currentUrl.searchParams.set('module', moduleVal);
        currentUrl.searchParams.set('count', countVal);

        if (scriptUrl) {
          currentUrl.searchParams.set('scriptUrl', scriptUrl);
        } else {
          currentUrl.searchParams.delete('scriptUrl');
        }

        navigator.clipboard.writeText(currentUrl.toString()).then(() => {
          let msg = '🔗 Student Quiz Link copied to clipboard! Share this link with students to auto-open in Student Mode.\n\nAssigned Module: ' + moduleVal + '\nQuestion Count: ' + countVal;
          if (scriptUrl) {
            msg += '\nGoogle Sheets Auto-Logger: ACTIVE';
          } else {
            msg += '\nNote: No Google Sheets URL was provided, so student scores will not be logged automatically.';
          }
          alert(msg);
        }).catch(err => {
          alert('Student Link: ' + currentUrl.toString());
        });
      }
    }

    // Initialize Quiz Engine Controller on Page Load
    window.addEventListener('DOMContentLoaded', () => {
      window.oettQuizEngine = new OETTQuizEngineController();
    });
  </script>
